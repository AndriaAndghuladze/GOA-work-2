{% extends 'master.html' %}

{% block title %} Todo List {% endblock %}

{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Task title" required><br><br>
        <button type="submit">Add Task</button>
        <br>
        <br>
        <h1>Tasks:</h1>

        {% for task in tasks %}
            
            <p>{{ task.title }}</p>
            <button><a href="{% url 'delete_task' task.id %}">Delete</a></button>

        {% endfor %}
        
    </form>
{% endblock %}
